<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstágioBot • Oportunidades & Monitoramento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              DEFAULT: '#235347',
              hover: '#1B4238',
              light: '#EAF1EE',
              surface: '#F4F7F5',
            },
            canvas: '#F5F6F5',
            ink: {
              DEFAULT: '#192420',
              muted: '#5C6C65',
              subtle: '#8A9992',
              border: '#E2E6E3',
              card: '#FFFFFF',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas text-ink antialiased min-h-screen flex flex-col selection:bg-brand selection:text-white">

  <!-- Minimal Header -->
  <header class="bg-ink-card border-b border-ink-border sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand & Live Pulse -->
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-brand text-white flex items-center justify-center font-bold text-sm shadow-sm">
          EB
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-bold text-ink leading-tight">EstágioBot</h1>
          <div class="flex items-center gap-1.5 text-xs text-ink-muted">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="header-status-text">Carregando status...</span>
          </div>
        </div>
      </div>

      <!-- Segmented Navigation Tabs -->
      <nav class="flex items-center p-1 bg-canvas rounded-xl border border-ink-border">
        <button id="nav-btn-vagas" onclick="switchView('vagas')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-ink-card text-brand shadow-sm transition">
          Vagas <span id="badge-total-vagas" class="ml-1 px-1.5 py-0.2 rounded-full bg-brand-light text-brand font-mono text-[11px]">0</span>
        </button>
        <button id="nav-btn-historico" onclick="switchView('historico')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium text-ink-muted hover:text-ink transition">
          Histórico de Checagens
        </button>
      </nav>

    </div>
  </header>

  <!-- Main Viewport -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

    <!-- ============================================== -->
    <!-- VIEW 1: VAGAS (OPORTUNIDADES DE ESTÁGIO)       -->
    <!-- ============================================== -->
    <div id="view-vagas" class="space-y-5">
      
      <!-- Search & Filters Toolbar -->
      <div class="bg-ink-card p-3 sm:p-4 rounded-xl border border-ink-border flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between shadow-xs">
        
        <!-- Search Input -->
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-subtle">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </span>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Pesquisar por empresa, linguagem ou tecnologia..." 
            class="w-full pl-9 pr-8 py-2 bg-canvas border border-ink-border rounded-lg text-xs sm:text-sm text-ink placeholder:text-ink-subtle focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition"
          >
          <button id="search-clear-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-ink-subtle hover:text-ink">
            ✕
          </button>
        </div>

        <!-- Filter Chips -->
        <div class="flex items-center gap-1.5">
          <button onclick="setFilter('all')" id="chip-all" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand text-white transition">
            Todas
          </button>
          <button onclick="setFilter('remoto')" id="chip-remoto" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-canvas text-ink-muted hover:text-ink border border-ink-border transition">
            Remoto
          </button>
          <button onclick="setFilter('bh')" id="chip-bh" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-canvas text-ink-muted hover:text-ink border border-ink-border transition">
            BH & Híbrido
          </button>
        </div>

      </div>

      <!-- Counter Summary -->
      <div class="flex items-center justify-between text-xs text-ink-muted px-1">
        <span id="jobs-counter-text">Carregando oportunidades...</span>
        <span class="text-[11px] text-ink-subtle">Sincronização em tempo real</span>
      </div>

      <!-- Job Cards Grid -->
      <div id="jobs-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Rendered dynamically -->
      </div>

    </div>

    <!-- ============================================== -->
    <!-- VIEW 2: HISTÓRICO DE AUDITORIA & OBSERVABILIDADE -->
    <!-- ============================================== -->
    <div id="view-historico" class="hidden space-y-4">
      
      <div class="bg-ink-card p-5 rounded-xl border border-ink-border shadow-xs">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-ink-border">
          <div>
            <h2 class="text-sm font-bold text-ink">Registro de Varreduras da IA</h2>
            <p class="text-xs text-ink-muted mt-0.5">Auditoria dos ciclos executados em segundo plano pelo agente</p>
          </div>
          <span class="font-mono text-xs text-brand bg-brand-light px-2.5 py-1 rounded-md font-semibold" id="total-runs-badge">
            0 checagens
          </span>
        </div>

        <div id="runs-list" class="divide-y divide-ink-border">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="border-t border-ink-border bg-ink-card py-4 mt-auto">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-ink-subtle gap-2">
      <div class="flex items-center gap-2">
        <span>EstágioBot AI</span>
        <span>•</span>
        <span>Desenvolvimento, Dados & Inteligência Artificial</span>
      </div>
      <div class="font-mono text-[11px]">
        Filtro ativo: Turno da manhã livre
      </div>
    </div>
  </footer>

  <!-- Data Sources -->
  <script src="historico_execucoes.js"></script>
  <script src="banco_vagas.js"></script>

  <!-- App Controller -->
  <script>
    let currentView = 'vagas';
    let currentFilter = 'all';
    let searchQuery = '';

    const executionData = (window.HISTORICO_EXECUCOES || []).slice();
    const dbJobs = (window.BANCO_VAGAS || []).slice();

    // Consolidate Unique Jobs
    function getConsolidatedJobs() {
      const map = new Map();
      dbJobs.forEach(job => {
        if (job.empresa && job.cargo) {
          const key = (job.empresa + '|' + job.cargo).toLowerCase();
          map.set(key, job);
        }
      });
      executionData.forEach(run => {
        if (Array.isArray(run.vagas)) {
          run.vagas.forEach(job => {
            const key = (job.empresa + '|' + job.cargo).toLowerCase();
            if (!map.has(key)) {
              map.set(key, { ...job, dataColeta: run.timestamp, notificada: true });
            }
          });
        }
      });
      return Array.from(map.values());
    }

    const allJobs = getConsolidatedJobs();

    document.addEventListener("DOMContentLoaded", () => {
      initHeader();
      renderJobs();
      renderHistory();
      setupSearch();

      // Auto-refresh silent listener (keeps page always fresh)
      window.addEventListener("focus", () => location.reload());
      setInterval(() => location.reload(), 60000);
    });

    function initHeader() {
      const lastRun = executionData.length > 0 ? executionData[0].timestamp : "Nenhuma recente";
      document.getElementById("header-status-text").innerText = `Última varredura: ${lastRun}`;
      document.getElementById("badge-total-vagas").innerText = allJobs.length;
      document.getElementById("total-runs-badge").innerText = `${executionData.length} varreduras registradas`;
    }

    function switchView(view) {
      currentView = view;
      const btnVagas = document.getElementById("nav-btn-vagas");
      const btnHist = document.getElementById("nav-btn-historico");
      const viewVagas = document.getElementById("view-vagas");
      const viewHist = document.getElementById("view-historico");

      if (view === 'vagas') {
        btnVagas.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-ink-card text-brand shadow-sm transition";
        btnHist.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium text-ink-muted hover:text-ink transition";
        viewVagas.classList.remove("hidden");
        viewHist.classList.add("hidden");
      } else {
        btnHist.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-ink-card text-brand shadow-sm transition";
        btnVagas.className = "px-3.5 py-1.5 rounded-lg text-xs font-medium text-ink-muted hover:text-ink transition";
        viewHist.classList.remove("hidden");
        viewVagas.classList.add("hidden");
      }
    }

    function setupSearch() {
      const input = document.getElementById("search-input");
      const clearBtn = document.getElementById("search-clear-btn");

      input.addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        if (searchQuery.length > 0) {
          clearBtn.classList.remove("hidden");
        } else {
          clearBtn.classList.add("hidden");
        }
        renderJobs();
      });
    }

    function clearSearch() {
      document.getElementById("search-input").value = "";
      searchQuery = "";
      document.getElementById("search-clear-btn").classList.add("hidden");
      renderJobs();
    }

    function setFilter(type) {
      currentFilter = type;
      const chips = {
        all: document.getElementById("chip-all"),
        remoto: document.getElementById("chip-remoto"),
        bh: document.getElementById("chip-bh")
      };

      Object.entries(chips).forEach(([key, btn]) => {
        if (!btn) return;
        if (key === type) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand text-white transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-medium bg-canvas text-ink-muted hover:text-ink border border-ink-border transition";
        }
      });

      renderJobs();
    }

    function renderJobs() {
      const container = document.getElementById("jobs-grid");
      const counterText = document.getElementById("jobs-counter-text");

      const filtered = allJobs.filter(job => {
        if (searchQuery) {
          const str = `${job.cargo} ${job.empresa} ${job.requisitos || ''} ${job.modalidade || ''}`.toLowerCase();
          if (!str.includes(searchQuery)) return false;
        }
        if (currentFilter === 'remoto') {
          return (job.modalidade || '').toLowerCase().includes('remoto');
        } else if (currentFilter === 'bh') {
          const mod = (job.modalidade || '').toLowerCase();
          return mod.includes('belo horizonte') || mod.includes('híbrido') || mod.includes('presencial') || mod.includes('bh');
        }
        return true;
      });

      counterText.innerHTML = `Mostrando <strong class="text-brand font-semibold">${filtered.length}</strong> de ${allJobs.length} vagas catalogadas`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center bg-ink-card rounded-xl border border-ink-border">
            <p class="text-xs text-ink-muted">Nenhuma oportunidade corresponde à sua busca.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(job => {
        const isRemoto = (job.modalidade || '').toLowerCase().includes('remoto');
        const badgeModalidade = isRemoto
          ? `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-brand bg-brand-light px-2 py-0.5 rounded-md">
               Remoto
             </span>`
          : `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-slate-700 bg-slate-100 px-2 py-0.5 rounded-md">
               ${job.modalidade || 'Híbrido/BH'}
             </span>`;

        return `
          <div class="bg-ink-card p-5 rounded-xl border border-ink-border flex flex-col justify-between hover:border-brand/40 transition shadow-xs">
            <div>
              <div class="flex items-center justify-between gap-2 mb-1.5">
                <span class="text-xs font-bold text-brand uppercase tracking-wider">${job.empresa || 'Empresa Confidencial'}</span>
                ${badgeModalidade}
              </div>

              <h3 class="text-sm sm:text-base font-bold text-ink leading-snug">
                ${job.cargo}
              </h3>

              ${job.requisitos ? `
                <p class="mt-2 text-xs text-ink-muted leading-relaxed line-clamp-3">
                  ${job.requisitos}
                </p>
              ` : ''}
            </div>

            <div class="mt-4 pt-3 border-t border-ink-border flex items-center justify-between gap-2">
              <span class="font-mono text-[11px] text-ink-subtle">
                ${job.dataColeta ? job.dataColeta.split(',')[0] : 'Recente'}
              </span>

              ${job.link ? `
                <a 
                  href="${job.link}" 
                  target="_blank" 
                  rel="noopener noreferrer" 
                  class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand text-white hover:bg-brand-hover transition"
                >
                  <span>Candidatar-se</span>
                  <span class="text-[10px]">↗</span>
                </a>
              ` : `
                <span class="text-xs text-ink-subtle">Link indisponível</span>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderHistory() {
      const container = document.getElementById("runs-list");
      if (executionData.length === 0) {
        container.innerHTML = `<div class="py-6 text-center text-xs text-ink-muted">Nenhum log registrado ainda.</div>`;
        return;
      }

      container.innerHTML = executionData.map(run => {
        const hasJobs = Array.isArray(run.vagas) && run.vagas.length > 0;
        const jobBadge = hasJobs 
          ? `<span class="text-[11px] font-semibold text-brand bg-brand-light px-2 py-0.5 rounded-md">${run.vagas.length} vaga(s) inédita(s)</span>`
          : `<span class="text-[11px] text-ink-subtle">Sem vagas inéditas</span>`;

        return `
          <div class="py-3 flex items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-3 min-w-0">
              <span class="font-mono text-ink-muted shrink-0">${run.timestamp}</span>
              <span class="text-ink truncate">${run.mensagem}</span>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="font-mono text-ink-subtle text-[11px]">⏱️ ${run.duracaoSegundos || 30}s</span>
              ${jobBadge}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
